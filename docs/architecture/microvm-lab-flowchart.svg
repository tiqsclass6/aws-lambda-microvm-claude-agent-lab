<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1020" width="940" height="1020" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- ============ BAND 1 · BUILD ============ -->
  <rect x="20" y="20" width="900" height="220" rx="14" fill="#F8FAFC" stroke="#6366F1" stroke-width="2"/>
  <text x="40" y="54" font-size="17" font-weight="700" fill="#312E81">🚧 1 · Build — Terraform Provisioning</text>

  <!-- Developer -->
  <rect x="50" y="95" width="250" height="95" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="175" y="135" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">👨‍💻 Developer</text>
  <text x="175" y="160" font-size="11.5" fill="#6B7280" text-anchor="middle">Terraform · AWS CLI</text>

  <!-- Package -->
  <rect x="345" y="95" width="250" height="95" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="470" y="135" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">📦 Package App</text>
  <text x="470" y="160" font-size="11.5" fill="#6B7280" text-anchor="middle">app.zip → S3 bucket</text>

  <!-- MicroVM Image -->
  <rect x="640" y="95" width="250" height="95" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="765" y="135" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">🧊 MicroVM Image</text>
  <text x="765" y="160" font-size="11.5" fill="#6B7280" text-anchor="middle">via CloudFormation</text>

  <!-- Build arrows -->
  <line x1="300" y1="142" x2="338" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="142" x2="633" y2="142" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BAND 2 · RUNTIME ============ -->
  <rect x="20" y="270" width="900" height="520" rx="14" fill="#F8FAFC" stroke="#06B6D4" stroke-width="2"/>
  <text x="40" y="304" font-size="17" font-weight="700" fill="#155E75">⚡ 2 · Runtime — Claude Webhook Flow</text>

  <!-- Claude -->
  <rect x="230" y="325" width="260" height="65" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
  <text x="360" y="352" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">🤖 Claude Managed Agents</text>
  <text x="360" y="374" font-size="11" fill="#6B7280" text-anchor="middle">Anthropic control plane</text>

  <!-- API Gateway -->
  <rect x="230" y="435" width="260" height="65" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
  <text x="360" y="462" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">🌐 API Gateway</text>
  <text x="360" y="484" font-size="11" fill="#6B7280" text-anchor="middle">POST /claude/webhook</text>

  <!-- Launcher Lambda -->
  <rect x="230" y="545" width="260" height="65" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
  <text x="360" y="572" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">🐍 Launcher Lambda</text>
  <text x="360" y="594" font-size="11" fill="#6B7280" text-anchor="middle">verifies Claude signature</text>

  <!-- MicroVM -->
  <rect x="230" y="655" width="260" height="80" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
  <text x="360" y="688" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">🧩 Lambda MicroVM</text>
  <text x="360" y="712" font-size="11" fill="#6B7280" text-anchor="middle">isolated worker · port 8080</text>

  <!-- ALL_INGRESS connector -->
  <rect x="610" y="652" width="230" height="52" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
  <text x="725" y="674" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">📥 ALL_INGRESS</text>
  <text x="725" y="692" font-size="10" fill="#6B7280" text-anchor="middle">inbound · auth token · port 8080</text>

  <!-- INTERNET_EGRESS connector -->
  <rect x="610" y="718" width="230" height="52" rx="10" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.5"/>
  <text x="725" y="740" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">🌍 INTERNET_EGRESS</text>
  <text x="725" y="758" font-size="10" fill="#6B7280" text-anchor="middle">outbound · external APIs</text>

  <!-- Runtime chain arrows -->
  <line x1="360" y1="390" x2="360" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="417" font-size="11" fill="#475569">webhook event</text>

  <line x1="360" y1="500" x2="360" y2="542" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="360" y1="610" x2="360" y2="652" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="372" y="637" font-size="11" fill="#16A34A">✅ valid → RunMicroVM</text>

  <!-- Invalid 401 (dashed, right side) -->
  <path d="M 490 577 H 545 V 467 H 496" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="554" y="524" font-size="11" fill="#EA580C">❌ invalid → 401</text>

  <!-- ALL_INGRESS → VM (inbound) -->
  <line x1="610" y1="678" x2="498" y2="678" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VM → INTERNET_EGRESS (outbound) -->
  <path d="M 490 726 H 540 V 744 H 602" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Results back to Claude (left side) -->
  <path d="M 230 695 H 110 V 357 H 224" fill="none" stroke="#0891B2" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="98" y="530" font-size="11.5" fill="#0891B2" text-anchor="middle" transform="rotate(-90 98 530)">📤 results (HTTPS)</text>

  <!-- Image → VM (cross-band) -->
  <path d="M 765 190 V 634 H 450 V 650" fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-dasharray="2 0" marker-end="url(#arrow)"/>
  <text x="775" y="430" font-size="11" fill="#4F46E5">provides image</text>

  <!-- ============ BAND 3 · SUPPORT ============ -->
  <rect x="20" y="830" width="900" height="170" rx="14" fill="#F8FAFC" stroke="#22C55E" stroke-width="2"/>
  <text x="40" y="864" font-size="17" font-weight="700" fill="#14532D">🛡️ 3 · Security &amp; Observability</text>

  <!-- Secrets Manager -->
  <rect x="50" y="895" width="200" height="70" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="150" y="925" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">🔑 Secrets Manager</text>
  <text x="150" y="947" font-size="10.5" fill="#6B7280" text-anchor="middle">webhook signing secret</text>

  <!-- IAM -->
  <rect x="273" y="895" width="200" height="70" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="373" y="925" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">🪪 IAM Roles</text>
  <text x="373" y="947" font-size="10.5" fill="#6B7280" text-anchor="middle">build · runtime · launcher</text>

  <!-- CloudWatch -->
  <rect x="496" y="895" width="200" height="70" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="596" y="925" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">📊 CloudWatch</text>
  <text x="596" y="947" font-size="10.5" fill="#6B7280" text-anchor="middle">logs &amp; alarms</text>

  <!-- CloudTrail -->
  <rect x="719" y="895" width="200" height="70" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="819" y="925" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">🧾 CloudTrail</text>
  <text x="819" y="947" font-size="10.5" fill="#6B7280" text-anchor="middle">audit events</text>

  <!-- Dotted links: runtime → support -->
  <line x1="230" y1="598" x2="152" y2="890" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen)"/>
  <line x1="420" y1="735" x2="594" y2="890" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen)"/>
  <line x1="470" y1="735" x2="800" y2="890" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen)"/>

</svg>
